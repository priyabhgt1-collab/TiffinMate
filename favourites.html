<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TiffinMate | Favourites</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #222;
        }

        .navbar {
            background: #ffffff;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #287a45;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #287a45;
        }

        .hero {
            background: linear-gradient(
                rgba(20, 70, 35, 0.85),
                rgba(20, 70, 35, 0.85)
            );
            color: white;
            padding: 70px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 17px;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h2 {
            font-size: 30px;
            color: #287a45;
            margin-bottom: 8px;
        }

        .heading p {
            color: #666;
        }

        #favourites {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .favourite-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            border: 1px solid #e8eee9;
        }

        .heart {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .favourite-card h3 {
            color: #287a45;
            margin-bottom: 10px;
            font-size: 21px;
        }

        .favourite-card p {
            color: #666;
            line-height: 1.5;
        }

        .remove-btn {
            margin-top: 18px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #ffe4e4;
            color: #c62828;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn:hover {
            background: #ffd2d2;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            color: #666;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        footer {
            margin-top: 70px;
            background: #173d25;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer h3 {
            margin-bottom: 8px;
        }

        footer p {
            opacity: 0.85;
            margin-bottom: 5px;
        }

        @media (max-width: 800px) {

            #favourites {
                grid-template-columns: repeat(2, 1fr);
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }
        }

        @media (max-width: 550px) {

            #favourites {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 32px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🍱 TiffinMate
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="meals.html">Meals</a>
            <a href="favourites.html">Favourites</a>
            <a href="admin.html">Admin</a>
        </div>

    </nav>


    <section class="hero">

        <h1>❤️ My Favourites</h1>

        <p>
            Your saved meals, all in one place.
        </p>

    </section>


    <main class="container">

        <div class="heading">

            <h2>My Favourite Meals</h2>

            <p>
                Meals you have saved from your weekly planner.
            </p>

        </div>


        <div id="favourites">

            <div class="empty">
                Loading favourites...
            </div>

        </div>

    </main>


    <footer>

        <h3>🍱 TiffinMate</h3>

        <p>
            Plan smart. Eat homemade. Stay happy.
        </p>

        <p>
            © 2026 TiffinMate
        </p>

    </footer>


    <script>

        async function loadFavourites() {

            const container =
                document.getElementById("favourites");

            try {

                const response =
                    await fetch("/api/favourites");

                if (!response.ok) {
                    throw new Error("Unable to load favourites");
                }

                const favourites =
                    await response.json();


                if (!favourites || favourites.length === 0) {

                    container.innerHTML = `
                        <div class="empty">

                            <div style="font-size:45px;">
                                💚
                            </div>

                            <h3 style="margin:15px 0;">
                                No favourites yet
                            </h3>

                            <p>
                                Go to the Meals page and add
                                your favourite meal.
                            </p>

                        </div>
                    `;

                    return;
                }


                /*
                    Remove duplicate meal names from display.
                    Old duplicate records in MongoDB will not
                    appear multiple times on the page.
                */

                const uniqueFavourites = [];

                const seenMeals = new Set();


                favourites.forEach(function(item) {

                    if (!seenMeals.has(item.meal)) {

                        seenMeals.add(item.meal);

                        uniqueFavourites.push(item);

                    }

                });


                let html = "";


                uniqueFavourites.forEach(function(item) {

                    html += `

                        <div class="favourite-card">

                            <div class="heart">
                                ❤️
                            </div>

                            <h3>
                                ${item.meal}
                            </h3>

                            <p>
                                This meal has been saved
                                to your favourites.
                            </p>

                            <button
                                class="remove-btn"
                                onclick="removeFavourite('${item._id}')">

                                🗑️ Remove

                            </button>

                        </div>

                    `;

                });


                container.innerHTML = html;


            } catch (error) {

                console.error(error);

                container.innerHTML = `

                    <div class="empty">

                        ❌ Unable to load favourites.

                    </div>

                `;

            }

        }


        async function removeFavourite(id) {

            const confirmRemove =
                confirm("Remove this meal from favourites?");


            if (!confirmRemove) {
                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/favourites/" + id,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Unable to remove favourite."
                    );

                    return;
                }


                loadFavourites();


            } catch (error) {

                console.error(error);

                alert(
                    "Server connection error."
                );

            }

        }


        loadFavourites();

    </script>

</body>

</html>
